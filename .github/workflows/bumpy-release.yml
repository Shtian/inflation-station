name: Bumpy Release

on:
  push:
    branches: [main]

concurrency:
  group: bumpy-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  plan:
    name: Plan
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      mode: ${{ steps.plan.outputs.mode }}
      bumpy_version: ${{ steps.bumpy-version.outputs.version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*

      - id: bumpy-version
        name: Resolve bumpy version
        run: echo "version=$(jq -r '.devDependencies["@varlock/bumpy"]' package.json)" >> "$GITHUB_OUTPUT"

      - id: plan
        name: Plan release
        run: pnpm dlx "@varlock/bumpy@$BUMPY_VERSION" ci plan
        env:
          BUMPY_VERSION: ${{ steps.bumpy-version.outputs.version }}
          GH_TOKEN: ${{ github.token }}

  version-pr:
    name: Update release PR
    needs: plan
    if: needs.plan.outputs.mode == 'version-pr'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    env:
      BUMPY_VERSION: ${{ needs.plan.outputs.bumpy_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*

      # BUMPY_GH_TOKEN opens the release PR as a real user, so CI runs on it.
      - name: Create or update release PR
        run: pnpm dlx "@varlock/bumpy@$BUMPY_VERSION" ci release --expect-mode version-pr
        env:
          GH_TOKEN: ${{ github.token }}
          BUMPY_GH_TOKEN: ${{ secrets.BUMPY_GH_TOKEN }}

  # The app is private, so publishing only tags the version and creates the
  # GitHub release. Nothing goes to npm.
  publish:
    name: Tag and release
    needs: plan
    if: needs.plan.outputs.mode == 'publish'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      BUMPY_VERSION: ${{ needs.plan.outputs.bumpy_version }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*

      - name: Create tag and GitHub release
        run: pnpm dlx "@varlock/bumpy@$BUMPY_VERSION" ci release --expect-mode publish
        env:
          GH_TOKEN: ${{ github.token }}
          BUMPY_GH_TOKEN: ${{ secrets.BUMPY_GH_TOKEN }}

  # Coolify can't be reached from Actions, so the release only pushes the
  # image. A poller on the VM deploys when `:latest` moves.
  image:
    name: Publish image
    needs: publish
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Mark job start
        run: echo "IMAGE_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"

      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - id: version
        name: Read version
        run: echo "version=$(jq -r .version package.json)" >> "$GITHUB_OUTPUT"

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Mark build start
        run: echo "IMAGE_BUILD_START_MS=$(date +%s%3N)" >> "$GITHUB_ENV"

      - id: build
        name: Build and push
        uses: docker/build-push-action@v7.4.0
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/shtian/inflation-station:${{ steps.version.outputs.version }}
            ghcr.io/shtian/inflation-station:latest
          build-args: |
            VERSION=${{ steps.version.outputs.version }}
            SOURCE_COMMIT=${{ github.sha }}
            VITE_SENTRY_DSN=${{ vars.VITE_SENTRY_DSN }}
            SENTRY_ORG=${{ vars.SENTRY_ORG }}
            SENTRY_PROJECT=${{ vars.SENTRY_PROJECT }}
          secrets: |
            SENTRY_AUTH_TOKEN=${{ secrets.SENTRY_AUTH_TOKEN }}

      # Runs right after the build, so its start is the build's end.
      - name: Report timings to Sentry
        if: always()
        run: node scripts/report-image-metrics.mjs
        env:
          VITE_SENTRY_DSN: ${{ vars.VITE_SENTRY_DSN }}
          IMAGE_VERSION: ${{ steps.version.outputs.version }}
          SOURCE_COMMIT: ${{ github.sha }}
          IMAGE_BUILD_OUTCOME: ${{ steps.build.outcome }}
          IMAGE_JOB_STATUS: ${{ job.status }}
