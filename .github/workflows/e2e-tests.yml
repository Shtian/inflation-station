name: E2E Tests

on:
  push:
    branches: [main]
  pull_request:

# A newer commit makes an in-flight run obsolete; E2E is the slowest job, so
# reclaiming that runner matters more here than in lint/unit-tests.
concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  e2e:
    name: Playwright
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    env:
      # Keep browsers inside the workspace so actions/cache can reach them.
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.playwright-browsers
      # `next start` refuses to serve a standalone build; see next.config.ts.
      NEXT_OUTPUT: default
      DATABASE_URL: file:${{ github.workspace }}/prisma/ci.db
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Resolve Playwright version
        id: playwright-version
        run: |
          echo "version=$(pnpm exec playwright --version | sed 's/^Version //')" >> "$GITHUB_OUTPUT"

      # Deliberately no restore-keys: a browser build is tied to one Playwright
      # version, so a near-miss must reinstall rather than reuse the wrong one.
      - name: Restore Playwright browsers
        id: playwright-cache
        uses: actions/cache@v6.1.0
        with:
          path: ${{ env.PLAYWRIGHT_BROWSERS_PATH }}
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}-chromium-shell

      # `--only-shell chromium` fetches the ~190 MB headless shell instead of
      # every engine (~1 GB). Safe because playwright.config.ts pins a single
      # chromium project and sets no `channel`. System libraries are omitted
      # (`--with-deps`) because the ubuntu-latest image already ships Chrome's;
      # add `install-deps` back here if a runner image ever drops them.
      - name: Install Chromium headless shell
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install --only-shell chromium

      - name: Restore Next.js build cache
        uses: actions/cache@v6.1.0
        with:
          path: .next/cache
          key: nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-${{ hashFiles('src/**', 'next.config.ts') }}
          restore-keys: |
            nextjs-${{ runner.os }}-${{ hashFiles('pnpm-lock.yaml') }}-

      - name: Create test database
        run: pnpm db:migrate:deploy

      # Building up front lets Playwright's webServer boot an already-compiled
      # server. `next dev` would recompile each route on first visit and spend
      # more time compiling than testing.
      - name: Build
        run: pnpm build

      - name: Run Playwright tests
        run: pnpm exec playwright test --reporter=github,html

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v7.0.1
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
