name: Lint

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    name: Lint and format
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      # `vp check` loads vite.config.mts, whose Varlock plugin validates
      # .env.schema. Lint opens no database, so any valid path will do.
      DATABASE_URL: file:./prisma/ci.db
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run vp check
        run: pnpm lint

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v7.0.1
        with:
          persist-credentials: false

      - name: Setup pnpm
        uses: pnpm/action-setup@v6.1.0

      - name: Setup Node.js
        uses: actions/setup-node@v7.0.0
        with:
          node-version: lts/*
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate Prisma client
        run: pnpm prisma generate

      # env.d.ts types `ENV` and is generated from .env.schema, not committed.
      - name: Generate Varlock types
        run: pnpm exec varlock codegen

      - name: Run typecheck
        run: pnpm typecheck
