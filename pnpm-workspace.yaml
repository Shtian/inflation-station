allowBuilds:
  '@prisma/engines': true
  better-sqlite3: true
  esbuild: false
  msw: false
  prisma: true
  sharp: false
  unrs-resolver: false

overrides:
  '@types/react': 19.2.14
  '@types/react-dom': 19.2.3
  vite@*: 'catalog:'
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.3.0
  vite-plus: 1.3.0
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: '*'
